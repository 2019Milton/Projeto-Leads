<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🚀 Plataforma de Leads</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* ===== FUNDO UNIVERSO ===== */
body {
  margin: 0;
  background: radial-gradient(circle at 20% 20%, #020617, #000);
  color: #e2e8f0;
  overflow-x: hidden;
}

/* ESTRELAS */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0.25;
  z-index: 0;
}

/* NEBULOSA */
body::after {
  content: "";
  position: fixed;
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(34,197,94,0.15), transparent 70%);
  top: -200px;
  left: -200px;
  z-index: 0;
  filter: blur(80px);
}

/* ANIMAÇÃO ESTRELAS */
@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

.stars {
  position: fixed;
  width: 100%;
  height: 200%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0.08;
  animation: starsMove 60s linear infinite;
  z-index: 0;
}

/* ===== LOGIN ===== */
.container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(15, 23, 42, 0.85);
  padding: 40px;
  border-radius: 15px;
  width: 350px;
  backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 
    0 0 0 1px rgba(34,197,94,0.2),
    0 0 30px rgba(34,197,94,0.1),
    0 10px 40px rgba(0,0,0,0.8);

  text-align: center;
  transition: 0.3s;
}

.login-box:hover {
  transform: translateY(-3px);
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;

  border: 1px solid rgba(255,255,255,0.08);
  background: #020617;
  color: white;

  transition: 0.2s;
}

input:focus, textarea:focus {
  outline: none;
  border: 1px solid #22c55e;
  box-shadow: 0 0 10px rgba(34,197,94,0.3);
}

/* BOTÕES */
button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

/* BOTÃO PRINCIPAL */
.btn {

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color: white;

  width: 100%;

  transition: 0.2s;

  box-shadow:
    0 0 15px rgba(124,58,237,0.25);
}

.btn:hover {

  transform: scale(1.02);

  box-shadow:
    0 0 20px rgba(37,99,235,0.45);
}

/* BOTÃO SAIR */
.logout {
  background: rgba(239,68,68,0.2);
  border: 1px solid rgba(239,68,68,0.4);
  color: #ef4444;
  padding: 6px 14px;
  font-size: 13px;
  transition: 0.2s;
}

.logout:hover {
  background: #ef4444;
  color: white;
}

/* ===== DASHBOARD ===== */
#app {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* TOPO */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* CARDS PREMIUM */
.card {
  background: linear-gradient(145deg, #020617, #020617);
  padding: 20px;
  border-radius: 15px;

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 
    0 0 0 1px rgba(34,197,94,0.15),
    0 0 20px rgba(34,197,94,0.05),
    0 10px 40px rgba(0,0,0,0.8);

  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 0 0 1px rgba(34,197,94,0.4),
    0 0 30px rgba(34,197,94,0.15),
    0 15px 50px rgba(0,0,0,0.9);
}

/* FULL */
.full {
  margin-top: 20px;
}

/* LEADS */
.lead {
  background: #020617;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.05);
  transition: 0.2s;
}

.lead:hover {
  border: 1px solid rgba(34,197,94,0.3);
}

/* STATUS */
.status-ok {
  color: #22c55e;
}

.campanha-item {

  border: 1px solid #1f2937;

  border-radius: 12px;

  padding: 15px;

  margin-top: 15px;

  background: rgba(255,255,255,0.03);
}

.campanhas-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;
}

.metricas-grid {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(120px, 1fr));

  gap: 12px;

  margin-top: 15px;
}

.metrica {

  background: rgba(255,255,255,0.04);

  border: 1px solid rgba(255,255,255,0.06);

  border-radius: 12px;

  padding: 12px;

  text-align: center;
}

.metrica span {

  display: block;

  font-size: 18px;

  font-weight: bold;

  margin-top: 6px;
}

.metrica small {

  opacity: 0.7;
}

.btn-sync {

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #06b6d4
    );

  border: none;

  color: white;

  padding: 8px 14px;

  border-radius: 10px;

  cursor: pointer;

  font-weight: bold;

  width: auto !important;

  min-width: auto !important;

  font-size: 13px;

  box-shadow:
    0 0 15px rgba(37,99,235,0.25);
}

.btn-sync:hover {

  transform: translateY(-2px);

  box-shadow:
    0 0 20px rgba(6,182,212,0.45);
}

.origem-badge {

  display: inline-block;

  padding: 4px 10px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: bold;

  margin-top: 10px;
}

.origem-plataforma {

  background: rgba(34,197,94,0.2);

  color: #22c55e;
}

.origem-meta {

  background: rgba(59,130,246,0.2);

  color: #60a5fa;
}

.card label {

  display: block;
  margin-top: 15px;
  margin-bottom: 5px;

  font-size: 14px;
  font-weight: bold;

  color: #d1d5db;
}

.card input,
.card select,
.card textarea {

  width: 100%;

  padding: 12px;

  border-radius: 10px;

  border: 1px solid #1f2937;

  background: #020617;

  color: white;

  margin-bottom: 5px;

  box-sizing: border-box;
}

.card textarea {

  min-height: 100px;
  resize: vertical;
}

.card button {

  width: auto;

  min-width: 140px;

  margin-top: 15px;

  padding: 10px 16px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color: white;

  font-weight: bold;

  cursor: pointer;

  transition: 0.25s;

  box-shadow:
    0 0 12px rgba(124,58,237,0.25);
}

.card button:hover {

  transform: translateY(-2px);

  box-shadow:
    0 0 20px rgba(37,99,235,0.45);
}

.switch {

  position: relative;

  display: inline-block;

  width: 50px;

  height: 26px;
}

.switch input {

  opacity: 0;

  width: 0;

  height: 0;
}

.slider {

  position: absolute;

  cursor: pointer;

  inset: 0;

  background: #444;

  transition: .3s;

  border-radius: 30px;
}

.slider:before {

  position: absolute;

  content: "";

  height: 20px;

  width: 20px;

  left: 3px;

  bottom: 3px;

  background: white;

  transition: .3s;

  border-radius: 50%;
}

.switch input:checked + .slider {

  background: #22c55e;
}

.switch input:checked + .slider:before {

  transform: translateX(24px);
}

.btn-excluir {

  background:
    linear-gradient(
      135deg,
      #dc2626,
      #991b1b
    );

  border: none;

  color: white;

  border-radius: 10px;

  padding: 6px 10px;

  cursor: pointer;

  font-size: 13px;

  min-width: auto !important;

  width: auto !important;

  box-shadow:
    0 0 12px rgba(220,38,38,0.25);
}

.btn-excluir:hover {

  transform: translateY(-2px);

  box-shadow:
    0 0 18px rgba(239,68,68,0.45);
}

.campanhas-topo {

  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

#filtro_status {

  background: #111827;
  border: 1px solid #7c3aed;
  color: white;

  padding: 10px 14px;

  border-radius: 10px;

  font-size: 14px;

  outline: none;
}

.campanhas-acoes {

  display: flex;
  gap: 12px;
  align-items: center;
}

.btn-sync {

  background: linear-gradient(
    135deg,
    #7c3aed,
    #2563eb
  );

  border: none;

  color: white;

  padding: 10px 16px;

  border-radius: 12px;

  cursor: pointer;

  font-weight: bold;

  transition: 0.2s;
}

.btn-sync:hover {

  transform: scale(1.03);

  opacity: 0.9;
}

  
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <div class="login-box">
    <h2>🚀 Plataforma de Leads</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">

  <div class="topbar">
    <h2>🚀 Central de Leads</h2>
    <button class="logout" onclick="logout()">Sair</button>
  </div>

  <div class="grid">

    <!-- META -->
    <div class="card">
      <h3>🔗 Conectar Meta</h3>
      <button class="btn" onclick="conectarMeta()">Conectar Facebook / Instagram</button>
      <div id="meta_info">
        Carregando conexão...
      </div>
    </div>

    <!-- 🔥 NOVO CARD -->
    <div class="card">
      <h3>📊 Status Meta</h3>
  
      <div id="status_meta">
        Carregando status...
      </div>
    </div>

    <!-- PUBLICAÇÃO -->
    <div class="card">

      <h3>📢 Criar Campanha</h3>
    
      <!-- 📝 NOME -->
      <label>Nome da campanha</label>
    
      <input
        type="text"
        id="campanha_nome"
        placeholder="Ex: Casas Alto Padrão"
      >
    
      <!-- 📘 PÁGINA -->
      <label>Página Facebook</label>
    
      <select id="pagina_select">
        <option>Carregando páginas...</option>
      </select>
    
      <!-- 🎯 OBJETIVO -->
      <label>Objetivo</label>
    
      <select id="objetivo_select">
    
        <option value="OUTCOME_LEADS">
          Geração de Leads
        </option>
    
        <option value="OUTCOME_TRAFFIC">
          Tráfego
        </option>
    
        <option value="OUTCOME_ENGAGEMENT">
          Engajamento
        </option>
    
      </select>
    
      <!-- 🖼️ IMAGEM -->
      <label>Imagem do anúncio</label>
    
      <input
        type="file"
        id="imagem"
      >
    
      <!-- ✍️ TEXTO -->
      <label>Texto do anúncio</label>
    
      <textarea
        id="texto"
        placeholder="Digite o texto do anúncio..."
      ></textarea>
    
      <!-- 🔘 CTA -->
      <label>Botão do anúncio</label>
    
      <select id="cta">
        <option value="LEARN_MORE">Saiba mais</option>
        <option value="SIGN_UP">Cadastre-se</option>
        <option value="APPLY_NOW">Solicitar agora</option>
      </select>
    
      <!-- 💰 ORÇAMENTO -->
      <label>Orçamento diário (R$)</label>
    
      <input
        type="number"
        id="orcamento"
        value="20"
        min="5"
      >
    
      <!-- 🚀 BOTÃO -->
      <button onclick="criarCampanhaCompleta()">
        🚀 Publicar Campanha
      </button>
    
    </div>

  </div>

  <!-- LEADS -->
  <div class="card campanhas-card">

    <div class="campanhas-topo">

      <h3>📢 Minhas Campanhas</h3>
    
      <div class="campanhas-acoes">
    
        <select
          id="filtro_status"
          onchange="carregarCampanhas()"
        >
    
          <option value="">
            Todas
          </option>
    
          <option value="ACTIVE">
            Ativas
          </option>
    
          <option value="PAUSED">
            Pausadas
          </option>
    
          <option value="DELETED">
            Excluídas
          </option>
    
          <option value="DRAFT">
            Rascunho
          </option>
    
        </select>
    
        <button
          id="btn-sync"
          class="btn-sync"
          onclick="sincronizarCampanhas()"
        >
          🔄 Sincronizar
        </button>
    
      </div>
    
    </div>
  
    <div id="campanhas_lista">
  
      <p>Carregando campanhas...</p>
  
    </div>
  
  </div>

</div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

// LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, senha })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    init();
  } else {
    alert("Login inválido");
  }
}

// INIT
async function init() {

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
  
    // 🔥 carrega status Meta
    await carregarStatusMeta();
  
    // 🔥 carrega campanhas
    await carregarCampanhas();
  
    // 🔥 carrega leads
    await carregarLeads();
  }
  
  // LOGOUT
  function logout() {
    localStorage.removeItem("token");
    location.reload();
  }
  
  // LEADS
  async function carregarLeads() {
    const token = localStorage.getItem("token");
  
    const res = await fetch(`${API}/leads`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });
  
    const data = await res.json();
  
    const lista = document.getElementById("lista");

    if (!lista) return;
    
    lista.innerHTML = "";
  
    data.forEach(l => {
      lista.innerHTML += `
        <div class="lead">
          <b>${l.nome}</b><br>
          📞 ${l.telefone || "-"}<br>
          📧 ${l.email || "-"}
        </div>
      `;
    });
  }

;

// SIMULAÇÕES
function conectarMeta() {

  const token = localStorage.getItem("token");

  if (!token) {
    alert("Usuário não autenticado");
    return;
  }

  window.open(
    `${API}/auth/meta/login?token=${encodeURIComponent(token)}`,
    "_blank",
    "width=600,height=700"
  );
}

async function criarCampanhaCompleta() {

  try {

    const token = localStorage.getItem("token");

    // 🔐 USER ID
    const payload = atob(token);
    const usuario_id = payload.split(":")[0];

    // 📝 CAMPOS
    const campanha_nome =
      document.getElementById("campanha_nome").value;

    const objetivo =
      document.getElementById("objetivo_select").value;

    const page_id =
      document.getElementById("pagina_select").value;

    const texto =
      document.getElementById("texto").value;

    const cta =
      document.getElementById("cta").value;

    const orcamento =
      document.getElementById("orcamento").value;

    if (!campanha_nome) {
      alert("Digite o nome da campanha");
      return;
    }

    // 🔥 CAMPANHA
    const campanhaRes = await fetch(
      `${API}/meta/campanha`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id,
          nome: campanha_nome,
          objetivo
        })
      }
    );

    const campanha = await campanhaRes.json();

    console.log("Campanha:", campanha);

    if (!campanha.id) {
      alert("Erro ao criar campanha");
      return;
    }

    // 🔥 FORM
    const formRes = await fetch(
      `${API}/meta/formulario`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id,
          page_id
        })
      }
    );

    const form = await formRes.json();

    console.log("FORM:", form);

    // 🔥 ADSET
    const adsetRes = await fetch(
      `${API}/meta/adset`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id,
          campaign_id: campanha.id,
          page_id,
          form_id: form.id,
          daily_budget: Number(orcamento) * 100
        })
      }
    );

    const adset = await adsetRes.json();

    console.log("ADSET:", adset);

    // 🔥 ANÚNCIO
    const anuncioRes = await fetch(
      `${API}/meta/anuncio`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id,
          adset_id: adset.id,
          page_id,
          form_id: form.id,
          texto,
          cta
        })
      }
    );

    const anuncio = await anuncioRes.json();

    console.log("ANUNCIO:", JSON.stringify(anuncio, null, 2));

    if (anuncio.error) {

      alert("Erro ao criar anúncio");

      return;
    }

    // 🔄 RELOAD
    await sincronizarCampanhas();

    alert("🚀 Campanha criada com sucesso");

  } catch (err) {

    console.error(err);

    alert("Erro ao criar campanha");
  }
}

async function carregarStatusMeta() {

  try {

    const token = localStorage.getItem("token");

    // 🔥 decodifica token
    const payload = atob(token);
    const usuario_id = payload.split(":")[0];

    const res = await fetch(
      `${API}/meta/status-completo/${usuario_id}`,
      {
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

    const data = await res.json();

    console.log("STATUS META:", data);


    const metaInfo = document.getElementById("meta_info");

    if (metaInfo) {
    
      if (data.conectado) {
    
        const conta = data.conta_anuncios;
    
        metaInfo.innerHTML = `

          <div style="margin-top:15px;">
        
            <div style="
              display:flex;
              align-items:center;
              gap:10px;
              margin-bottom:15px;
            ">
        
              <img
                src="${data.usuario_meta?.picture?.data?.url || ''}"
                style="
                  width:50px;
                  height:50px;
                  border-radius:50%;
                  border:2px solid #22c55e;
                "
              >
        
              <div>
                <div style="font-weight:bold;">
                  ${data.usuario_meta?.name || "Usuário Meta"}
                </div>
        
                <div style="color:#22c55e;">
                  🟢 Meta conectada
                </div>
              </div>
        
            </div>
        
            <p>
              <b>📘 Página:</b><br>
              ${data.paginas?.[0]?.name || "-"}
            </p>
        
            <p>
              <b>📸 Instagram:</b><br>
              ${
                data.instagram?.username
                  ? '@' + data.instagram.username
                  : "Não conectado"
              }
            </p>
        
            <p>
              <b>📢 Campanhas:</b><br>
              ${data.metricas?.campanhas || 0}
            </p>
        
            <p>
              <b>🟢 Ativas:</b><br>
              ${data.metricas?.campanhas_ativas || 0}
            </p>
        
            <p>
              <b>💰 Gasto hoje:</b><br>
              ${data.metricas?.gasto_hoje || "R$ 0,00"}
            </p>
        
            <p>
              <b>🧲 Leads hoje:</b><br>
              ${data.metricas?.leads_hoje || 0}
            </p>
        
            <p>
              <b>🕒 Último sync:</b><br>
              ${new Date(data.metricas?.ultimo_sync).toLocaleString()}
            </p>
        
          </div>
        `;
    
      } else {
    
        metaInfo.innerHTML = `
          <p style="color:#ef4444;font-weight:bold;margin-top:15px;">
            🔴 Nenhuma conta conectada
          </p>
        `;
      }
    }

    const div = document.getElementById("status_meta");

    div.innerHTML = `
      <p>
        ${data.conectado ? "🟢" : "🔴"}
        Meta conectada
      </p>

      <p>
        ${data.conta_anuncios?.ativa ? "🟢" : "🔴"}
        Conta de anúncios ativa
      </p>

      <p>
        ${data.conta_anuncios?.possui_pagamento ? "🟢" : "🔴"}
        Forma de pagamento
      </p>

      <p>
        ${data.paginas?.length > 0 ? "🟢" : "🔴"}
        Página conectada
      </p>

      <hr>

      <h4>
        ${
          data.pronto_para_anunciar
            ? "🚀 Pronto para anunciar"
            : "⚠️ Ajustes necessários"
        }
      </h4>
    `;

    // 🔥 SELECT DE PÁGINAS
    const select = document.getElementById("pagina_select");

    if (select) {

      select.innerHTML = "";

      data.paginas?.forEach(p => {

        select.innerHTML += `
          <option value="${p.id}">
            ${p.name}
          </option>
        `;
      });
    }

  } catch (err) {

    console.error("ERRO STATUS META:", err);
  }
}


async function carregarCampanhas() {

  const token = localStorage.getItem("token");

  // 🔥 busca métricas reais
  const res = await fetch(
    `${API}/meta/metricas-campanhas`,
    {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    }
  );

  const campanhas = await res.json();

  console.log("CAMPANHAS:", campanhas);

  const filtro =
    document.getElementById("filtro_status")?.value;
  
  let campanhasFiltradas = campanhas;
  
  if (filtro) {
  
    campanhasFiltradas = campanhas.filter(c =>
      c.status === filtro
    );
  }

  const div = document.getElementById("campanhas_lista");

  div.innerHTML = "";

  if (!campanhas.length) {

    div.innerHTML = `
      <p>Nenhuma campanha criada ainda.</p>
    `;

    return;
  }

  campanhasFiltradas.forEach(c => {

    div.innerHTML += `

      <div class="campanha-card">

        <div class="campanha-topo">

          <div class="campanha-header">

            <h3>
              ${c.nome}
            </h3>
          
            <label class="switch">
          
              <input
                type="checkbox"
                ${c.status === "ACTIVE" ? "checked" : ""}
                onchange="
                  toggleCampanha(
                    '${c.campaign_id}',
                    '${c.status}'
                  )
                "
              >
          
              <span class="slider"></span>
          
            </label>

            <button
              class="btn-excluir"
              onclick="
                excluirCampanha(
                  '${c.campaign_id}'
                )
              "
            >
              🗑️
            </button>
          
          </div>

          <span class="badge ${c.origem}">
            ${c.origem}
          </span>

        </div>

        <p>
          Status:
          <b>${c.status}</b>
        </p>

        <div class="metricas-grid">

          <div class="metrica">
            💰
            <span>
              R$ ${Number(c.gasto).toFixed(2)}
            </span>
            <small>Gasto</small>
          </div>

          <div class="metrica">
            🎯
            <span>
              ${c.leads}
            </span>
            <small>Leads</small>
          </div>

          <div class="metrica">
            👁️
            <span>
              ${c.impressoes}
            </span>
            <small>Impressões</small>
          </div>

          <div class="metrica">
            🖱️
            <span>
              ${c.cliques}
            </span>
            <small>Cliques</small>
          </div>

          <div class="metrica">
            📈
            <span>
              ${Number(c.ctr).toFixed(2)}%
            </span>
            <small>CTR</small>
          </div>

          <div class="metrica">
            💵
            <span>
              R$ ${Number(c.cpc).toFixed(2)}
            </span>
            <small>CPC</small>
          </div>

        </div>

        <small>
          Criado em:
          ${new Date(c.criado_em).toLocaleString()}
        </small>

      </div>
    `;
  });
}

async function sincronizarCampanhas() {

  const token =
    localStorage.getItem("token");

  const btn =
    document.getElementById("btn-sync");

  btn.disabled = true;

  btn.innerHTML = "🔄 Sincronizando...";

  try {

    const res = await fetch(
      `${API}/meta/sincronizar-campanhas`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

    const data = await res.json();

    console.log("SYNC:", data);

    if (data.error) {

      alert(data.error);

      return;
    }

    await carregarCampanhas();

    alert("Campanhas sincronizadas 🚀");

  } catch (err) {

    console.error(err);

    alert("Erro ao sincronizar");

  } finally {

    btn.disabled = false;

    btn.innerHTML = "🔄 Sincronizar";
  }
}



async function toggleCampanha(campaign_id, statusAtual) {

  const token = localStorage.getItem("token");

  const novoStatus =
    statusAtual === "ACTIVE"
      ? "PAUSED"
      : "ACTIVE";

  const res = await fetch(
    `${API}/meta/toggle-campanha`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },

      body: JSON.stringify({
        campaign_id,
        status: novoStatus
      })
    }
  );

  const data = await res.json();

  console.log("TOGGLE:", data);

  if (data.error) {

    alert(data.error);
    return;
  }

  await carregarCampanhas();
}

async function excluirCampanha(campaign_id) {

  const confirmar = confirm(
    "Deseja realmente excluir esta campanha?"
  );

  if (!confirmar) {
    return;
  }

  try {

    const token = localStorage.getItem("token");

    const res = await fetch(
      `${API}/meta/excluir-campanha`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },

        body: JSON.stringify({
          campaign_id
        })
      }
    );

    const texto = await res.text();

    console.log("RAW EXCLUIR:", texto);

    const data = JSON.parse(texto);

    console.log("EXCLUIR:", data);

    if (data.error) {

      alert(data.error);
      return;
    }

    await carregarCampanhas();

    alert("🗑️ Campanha excluída");

  } catch (err) {

    console.error("ERRO EXCLUIR:", err);

    alert("Erro ao excluir campanha");
  }
}
