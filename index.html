<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Leads</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
    .card {
      background: #1e293b;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>🔐 Login</h2>
<input id="email" placeholder="Email">
<input id="senha" placeholder="Senha" type="password">
<button onclick="login()">Entrar</button>

<hr>

<h2>📊 Leads</h2>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="emailLead" placeholder="Email">
<button onclick="criarLead()">Criar Lead</button>

<div id="leads"></div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

function salvarToken(token) {
  localStorage.setItem("token", token);
}

function pegarToken() {
  return localStorage.getItem("token");
}

async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login-test?email=${email}&senha=${senha}`);
  const data = await res.json();

  if (data.token) {
    salvarToken(data.token);
    alert("Login OK 🚀");
    carregarLeads();
  } else {
    alert("Erro no login");
  }
}

async function carregarLeads() {
  const token = pegarToken();

  const res = await fetch(`${API}/leads`, {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  const data = await res.json();

  const div = document.getElementById("leads");
  div.innerHTML = "";

  data.forEach(l => {
    div.innerHTML += `
      <div class="card">
        <b>${l.nome}</b><br>
        📞 ${l.telefone}<br>
        ✉️ ${l.email}
      </div>
    `;
  });
}

async function criarLead() {
  const token = pegarToken();

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const email = document.getElementById("emailLead").value;

  await fetch(`${API}/leads`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ nome, telefone, email })
  });

  alert("Lead criado 🚀");
  carregarLeads();
}

// auto carregar se já tiver token
if (pegarToken()) {
  carregarLeads();
}
</script>

</body>
</html>
