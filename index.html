<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🚀 Plataforma de Leads</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* ===== FUNDO UNIVERSO ===== */
body {
  margin: 0;
  background: radial-gradient(circle at 20% 20%, #020617, #000);
  color: #e2e8f0;
  overflow-x: hidden;
}

/* ESTRELAS */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0.25;
  z-index: 0;
}

/* NEBULOSA */
body::after {
  content: "";
  position: fixed;
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(34,197,94,0.15), transparent 70%);
  top: -200px;
  left: -200px;
  z-index: 0;
  filter: blur(80px);
}

/* ANIMAÇÃO ESTRELAS */
@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

.stars {
  position: fixed;
  width: 100%;
  height: 200%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0.08;
  animation: starsMove 60s linear infinite;
  z-index: 0;
}

/* ===== LOGIN ===== */
.container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(15, 23, 42, 0.85);
  padding: 40px;
  border-radius: 15px;
  width: 350px;
  backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 
    0 0 0 1px rgba(34,197,94,0.2),
    0 0 30px rgba(34,197,94,0.1),
    0 10px 40px rgba(0,0,0,0.8);

  text-align: center;
  transition: 0.3s;
}

.login-box:hover {
  transform: translateY(-3px);
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;

  border: 1px solid rgba(255,255,255,0.08);
  background: #020617;
  color: white;

  transition: 0.2s;
}

input:focus, textarea:focus {
  outline: none;
  border: 1px solid #22c55e;
  box-shadow: 0 0 10px rgba(34,197,94,0.3);
}

/* BOTÕES */
button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

/* BOTÃO PRINCIPAL */
.btn {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  width: 100%;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.02);
  box-shadow: 0 0 15px rgba(34,197,94,0.4);
}

/* BOTÃO SAIR */
.logout {
  background: rgba(239,68,68,0.2);
  border: 1px solid rgba(239,68,68,0.4);
  color: #ef4444;
  padding: 6px 14px;
  font-size: 13px;
  transition: 0.2s;
}

.logout:hover {
  background: #ef4444;
  color: white;
}

/* ===== DASHBOARD ===== */
#app {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* TOPO */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* CARDS PREMIUM */
.card {
  background: linear-gradient(145deg, #020617, #020617);
  padding: 20px;
  border-radius: 15px;

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 
    0 0 0 1px rgba(34,197,94,0.15),
    0 0 20px rgba(34,197,94,0.05),
    0 10px 40px rgba(0,0,0,0.8);

  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 0 0 1px rgba(34,197,94,0.4),
    0 0 30px rgba(34,197,94,0.15),
    0 15px 50px rgba(0,0,0,0.9);
}

/* FULL */
.full {
  margin-top: 20px;
}

/* LEADS */
.lead {
  background: #020617;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.05);
  transition: 0.2s;
}

.lead:hover {
  border: 1px solid rgba(34,197,94,0.3);
}

/* STATUS */
.status-ok {
  color: #22c55e;
}

.campanha-item {

  border: 1px solid #1f2937;

  border-radius: 12px;

  padding: 15px;

  margin-top: 15px;

  background: rgba(255,255,255,0.03);
}

.campanhas-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;
}

.btn-sync {

  background: #2563eb;

  border: none;

  color: white;

  padding: 10px 16px;

  border-radius: 10px;

  cursor: pointer;

  font-weight: bold;
}

.btn-sync:hover {

  opacity: 0.9;
}

.origem-badge {

  display: inline-block;

  padding: 4px 10px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: bold;

  margin-top: 10px;
}

.origem-plataforma {

  background: rgba(34,197,94,0.2);

  color: #22c55e;
}

.origem-meta {

  background: rgba(59,130,246,0.2);

  color: #60a5fa;
}

  
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <div class="login-box">
    <h2>🚀 Plataforma de Leads</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">

  <div class="topbar">
    <h2>🚀 Dashboard</h2>
    <button class="logout" onclick="logout()">Sair</button>
  </div>

  <div class="grid">

    <!-- META -->
    <div class="card">
      <h3>🔗 Conectar Meta</h3>
      <button class="btn" onclick="conectarMeta()">Conectar Facebook / Instagram</button>
      <p id="statusMeta">Não conectado</p>
    </div>

    <!-- 🔥 NOVO CARD -->
    <div class="card">
      <h3>📊 Status Meta</h3>
  
      <div id="status_meta">
        Carregando status...
      </div>
    </div>

    <!-- PUBLICAÇÃO -->
    <div class="card">
      <h3>📢 Criar Publicação</h3>
    
      <label>Página Facebook</label>
    
      <select id="pagina_select">
        <option>Carregando páginas...</option>
      </select>
    
      <input type="file">
    
      <textarea id="textoPost"
        placeholder="Texto do anúncio">
      </textarea>
    
      <button class="btn"
        onclick="criarCampanhaCompleta()">
        Criar Campanha de Leads 🚀
      </button>
    </div>

  </div>

  <!-- LEADS -->
  <div class="card full">
    <div class="campanhas-header">

      <h3>📢 Minhas Campanhas</h3>
    
      <button
        class="btn-sync"
        onclick="sincronizarCampanhas()"
      >
        🔄 Sincronizar
      </button>
    
    </div>
    
    <div id="listaCampanhas"></div>
  </div>

</div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

// LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, senha })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    init();
  } else {
    alert("Login inválido");
  }
}

// INIT
function init() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  carregarLeads();

  carregarStatusMeta();
  
  carregarCampanhas();
  }
  
  // LOGOUT
  function logout() {
    localStorage.removeItem("token");
    location.reload();
  }
  
  // LEADS
  async function carregarLeads() {
    const token = localStorage.getItem("token");
  
    const res = await fetch(`${API}/leads`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });
  
    const data = await res.json();
  
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
  
    data.forEach(l => {
      lista.innerHTML += `
        <div class="lead">
          <b>${l.nome}</b><br>
          📞 ${l.telefone || "-"}<br>
          📧 ${l.email || "-"}
        </div>
      `;
    });
  }

carregarStatusMeta();

// SIMULAÇÕES
function conectarMeta() {

  const token = localStorage.getItem("token");

  if (!token) {
    alert("Usuário não autenticado");
    return;
  }

  window.open(
    `${API}/auth/meta/login?token=${encodeURIComponent(token)}`,
    "_blank",
    "width=600,height=700"
  );
}

async function criarCampanhaCompleta() {

  try {

    // 🔐 token login
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Usuário não autenticado");
      return;
    }

    // 🔐 pega usuário do token
    const payload = atob(token);
    const usuario_id = payload.split(":")[0];

    // 📄 página selecionada
    const page_id =
      document.getElementById("pagina_select").value;

    if (!page_id) {
      alert("Selecione uma página");
      return;
    }

    // =========================================
    // 1️⃣ CRIA CAMPANHA
    // =========================================

    const campanhaRes = await fetch(`${API}/meta/campanha`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        usuario_id
      })
    });

    const campanha = await campanhaRes.json();

    console.log("Campanha:", campanha);

    if (!campanha.id) {
      console.error(campanha);

      alert(
        campanha?.error?.message ||
        "Erro ao criar campanha"
      );

      return;
    }

    const campanha_id = campanha.id;

    // =========================================
    // 2️⃣ CRIA FORMULÁRIO
    // =========================================

    const formRes = await fetch(`${API}/meta/formulario`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        usuario_id,
        page_id
      })
    });

    const form = await formRes.json();

    console.log("FORM:", form);

    if (!form.id) {
      console.error(form);

      alert(
        form?.error ||
        "Erro ao criar formulário"
      );

      return;
    }

    const form_id = form.id;

    // =========================================
    // 3️⃣ CRIA ADSET
    // =========================================

    const adsetRes = await fetch(`${API}/meta/adset`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        usuario_id,
        campaign_id: campanha_id,
        page_id,
        form_id
      })
    });

    const adset = await adsetRes.json();

    console.log("AdSet:", adset);

    if (!adset.id) {
      console.error(adset);

      alert(
        adset?.error?.message ||
        adset?.error_user_msg ||
        "Erro ao criar conjunto de anúncios"
      );

      return;
    }

    // =========================================
    // 4️⃣ CRIA ANÚNCIO
    // =========================================

    const anuncioRes = await fetch(`${API}/meta/anuncio`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        usuario_id,
        campaign_id: campanha_id,
        adset_id: adset.id,
        page_id,
        form_id
      })
    });

    const anuncio = await anuncioRes.json();

    console.log("ANUNCIO:", anuncio);

    if (!anuncio.id) {
      console.error(anuncio);

      alert(
        anuncio?.error?.message ||
        anuncio?.error_user_msg ||
        "Erro ao criar anúncio"
      );

      return;
    }

    // =========================================
    // ✅ SUCESSO
    // =========================================

    alert("Campanha completa criada 🚀");
    carregarCampanhas();

  } catch (err) {

    console.error("ERRO GERAL:", err);

    alert("Erro interno ao criar campanha");

  }
}

async function carregarStatusMeta() {

  const res = await fetch(
    `${API}/meta/status-completo/1`
  );

  const data = await res.json();

  console.log("STATUS META:", data);

  const div = document.getElementById("status_meta");

  div.innerHTML = `
  
    <p>
      ${data.conectado ? "🟢" : "🔴"}
      Meta conectada
    </p>

    <p>
      ${data.conta_anuncios?.ativa ? "🟢" : "🔴"}
      Conta de anúncios ativa
    </p>

    <p>
      ${data.conta_anuncios?.possui_pagamento ? "🟢" : "🔴"}
      Forma de pagamento
    </p>

    <p>
      ${data.paginas?.length > 0 ? "🟢" : "🔴"}
      Página conectada
    </p>

    <hr>

    <h4>
      ${
        data.pronto_para_anunciar
          ? "🚀 Pronto para anunciar"
          : "⚠️ Ajustes necessários"
      }
    </h4>
  `;

  const select = document.getElementById("pagina_select");

  select.innerHTML = "";
  
  data.paginas.forEach(p => {
  
    select.innerHTML += `
      <option value="${p.id}">
        ${p.name}
      </option>
    `;
  
  });
  
  }
}

async function carregarCampanhas() {

  try {

    const token = localStorage.getItem("token");

    const res = await fetch(`${API}/campanhas`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const campanhas = await res.json();

    console.log("CAMPANHAS:", campanhas);

    const div =
      document.getElementById("listaCampanhas");

    div.innerHTML = "";

    if (!campanhas.length) {

      div.innerHTML = `
        <p>Nenhuma campanha criada ainda.</p>
      `;

      return;
    }

    campanhas.forEach(c => {

  const origemClass =
    c.origem === "plataforma"
      ? "origem-plataforma"
      : "origem-meta";

  const origemTexto =
    c.origem === "plataforma"
      ? "🚀 Plataforma"
      : "🔵 Meta";

  div.innerHTML += `
    <div class="campanha-item">

      <div>

        <strong>
          ${c.nome}
        </strong>

      </div>

      <div style="margin-top:10px;">

        Status:
        ${c.status}

      </div>

      <div class="
        origem-badge
        ${origemClass}
      ">

        ${origemTexto}

      </div>

      <div style="margin-top:10px;">

        Criado em:
        ${new Date(c.criado_em)
          .toLocaleString("pt-BR")}

      </div>

    </div>
  `;
});

} catch (err) {

  console.error(err);

}
}

async function sincronizarCampanhas() {

  try {

    const token = localStorage.getItem("token");

    const res = await fetch(
      `${API}/meta/sincronizar-campanhas`,
      {
        method: "POST",

        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const data = await res.json();

    console.log(data);

    alert("Campanhas sincronizadas 🚀");

    carregarCampanhas();

  } catch (err) {

    console.error(err);

    alert("Erro ao sincronizar");

  }
}




// AUTO LOGIN
const token = localStorage.getItem("token");
if (token) init();
</script>

</body>
</html>
