<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Leads</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: url("https://images.unsplash.com/photo-1557838923-2985c318be48?q=80&w=1600") no-repeat center center;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* overlay escuro */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(11, 27, 43, 0.85);
  z-index: 0;
}

/* container */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  background: #0b1b2b;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* app depois login */
#app {
  display: none;
  width: 100%;
  max-width: 700px;
}

/* inputs */
input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}

/* botões */
button {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}

.btn {
  background: #22c55e;
  color: white;
}

.logout {
  background: #ef4444;
}

/* leads */
.lead {
  background: #1e293b;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}
</style>

</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>🔐 Login</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
  </div>

  <!-- APP -->
  <div id="app">

    <button class="logout" onclick="logout()">Sair</button>
  
    <div class="dashboard">
  
      <!-- 🔗 CONEXÃO META -->
      <div class="card">
        <h3>🔗 Conectar Meta</h3>
        <button class="btn" onclick="conectarMeta()">
          Conectar Facebook / Instagram
        </button>
        <p id="statusMeta">Não conectado</p>
      </div>
  
      <!-- 📢 CRIAR PUBLICAÇÃO -->
      <div class="card">
        <h3>📢 Criar Publicação</h3>
  
        <input type="file" id="imagem">
        <textarea id="textoPost" placeholder="Texto do anúncio"></textarea>
  
        <button class="btn" onclick="criarPost()">
          Publicar
        </button>
      </div>
  
    </div>
  
    <!-- 📊 CAMPANHAS / LEADS -->
    <div class="card full">
      <h3>📊 Campanhas e Leads</h3>
      <div id="lista"></div>
    </div>

</div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

// 🔐 LOGIN (AGORA CORRETO COM POST)
async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, senha })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    init();
  } else {
    alert(data.error || "Login inválido");
  }
}

// 🚪 LOGOUT
function logout() {
  localStorage.removeItem("token");
  location.reload();
}

// 🚀 INICIAR APP
function init() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  carregarLeads();
}

// 📥 LISTAR LEADS
async function carregarLeads() {
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/leads`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(l => {
    lista.innerHTML += `
      <div class="lead">
        <b>${l.nome}</b><br>
        📞 ${l.telefone || "-"}<br>
        📧 ${l.email || "-"}
      </div>
    `;
  });
}

// ➕ CRIAR LEAD
async function criarLead() {
  const token = localStorage.getItem("token");

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const email = document.getElementById("emailLead").value;

  await fetch(`${API}/leads`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ nome, telefone, email })
  });

  carregarLeads();
}

// 🔒 AUTO LOGIN
const token = localStorage.getItem("token");
if (token) {
  init();
}
</script>

</body>
</html>
