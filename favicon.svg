<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 130">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="40%"  stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo -->
  <ellipse cx="40" cy="122" rx="24" ry="12" fill="url(#g)"/>

  <!-- Chamas -->
  <path d="M 27 106 Q 20 124 40 130 Q 60 124 53 106 Z" fill="url(#fa)"/>
  <path d="M 31 106 Q 26 120 40 126 Q 54 120 49 106 Z" fill="url(#fb)" opacity="0.9"/>
  <ellipse cx="40" cy="109" rx="5" ry="5.5" fill="#dcfce7" opacity="0.95"/>

  <!-- Aletas -->
  <path d="M 25 90 L 2 114 L 3 98 L 20 80 Z"  fill="url(#fi)"/>
  <path d="M 55 90 L 78 114 L 77 98 L 60 80 Z" fill="url(#fi)"/>

  <!-- Bocal -->
  <path d="M 28 100 L 24 108 L 56 108 L 52 100 Z" fill="#0f172a"/>
  <ellipse cx="40" cy="108" rx="16" ry="3.5" fill="#1e293b"/>

  <!-- Motor -->
  <rect x="22" y="88" width="36" height="14" rx="2" fill="#334155"/>
  <line x1="30" y1="88" x2="30" y2="102" stroke="#64748b" stroke-width="1.3" opacity="0.8"/>
  <line x1="40" y1="88" x2="40" y2="102" stroke="#64748b" stroke-width="1.3" opacity="0.8"/>
  <line x1="50" y1="88" x2="50" y2="102" stroke="#64748b" stroke-width="1.3" opacity="0.8"/>

  <!-- Anel inferior -->
  <rect x="20" y="83" width="40" height="7" rx="2" fill="#475569"/>

  <!-- Tanque principal -->
  <rect x="22" y="44" width="36" height="41" fill="url(#b)"/>
  <rect x="22" y="57" width="36" height="8"  fill="#22c55e" opacity="0.82"/>
  <rect x="22" y="65" width="36" height="2"  fill="#15803d"/>
  <rect x="22" y="75" width="36" height="3.5" fill="#1d4ed8" opacity="0.45"/>

  <!-- Anel superior -->
  <rect x="20" y="38" width="40" height="8" rx="2" fill="#475569"/>

  <!-- Fairing -->
  <rect x="24" y="20" width="32" height="20" rx="3" fill="#f8fafc"/>
  <rect x="24" y="29" width="32" height="4.5" fill="#3b82f6" opacity="0.72"/>

  <!-- Janela -->
  <circle cx="40" cy="27" r="8"   fill="#1e293b" stroke="#475569" stroke-width="1.4"/>
  <circle cx="40" cy="27" r="6.2" fill="url(#w)"/>
  <ellipse cx="37" cy="24" rx="2.8" ry="1.7" fill="white" opacity="0.42" transform="rotate(-18 37 24)"/>

  <!-- Cone do nariz -->
  <path d="M 40 3 L 56 20 L 24 20 Z" fill="url(#n)"/>
  <path d="M 40 3 L 31 20 L 36 20 Z" fill="white" opacity="0.18"/>
</svg>
