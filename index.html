<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Leads</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: url("https://images.unsplash.com/photo-1557838923-2985c318be48?q=80&w=1600") no-repeat center center;
  background-size: cover;
  color: white;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(11, 27, 43, 0.85);
  z-index: 0;
}

/* LOGIN CENTRAL */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  width: 100%;
  max-width: 400px;
  background: #0b1b2b;
  padding: 30px;
  border-radius: 12px;
}

/* DASHBOARD */
#app {
  display: none;
  position: relative;
  z-index: 1;
  width: 100%;
  padding: 20px;
}

/* TOPO */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

/* GRID */
.grid {
  display: flex;
  gap: 20px;
}

/* CARDS */
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  flex: 1;
}

.full {
  margin-top: 20px;
  width: 100%;
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

/* BOTÕES */
button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
  width: 100%;
}

.btn {
  background: #22c55e;
  color: white;
}

.logout {
  background: #ef4444;
  width: auto;
  padding: 10px 20px;
}

/* LEADS */
.lead {
  background: #0b1b2b;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <div class="login-box">
    <h2>🔐 Login</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">

  <div class="topbar">
    <h2>🚀 Plataforma de Leads</h2>
    <button class="logout" onclick="logout()">Sair</button>
  </div>

  <div class="grid">

    <!-- META -->
    <div class="card">
      <h3>🔗 Conectar Meta</h3>
      <button class="btn" onclick="conectarMeta()">
        Conectar Facebook / Instagram
      </button>
      <p id="statusMeta">Não conectado</p>
    </div>

    <!-- PUBLICAÇÃO -->
    <div class="card">
      <h3>📢 Criar Publicação</h3>
      <input type="file">
      <textarea id="textoPost" placeholder="Texto do anúncio"></textarea>
      <button class="btn" onclick="criarPost()">Publicar</button>
    </div>

  </div>

  <!-- LEADS -->
  <div class="card full">
    <h3>📊 Leads</h3>
    <div id="lista"></div>
  </div>

</div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

// LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, senha })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    init();
  } else {
    alert(data.error || "Login inválido");
  }
}

// LOGOUT
function logout() {
  localStorage.removeItem("token");
  location.reload();
}

// INIT
function init() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  carregarLeads();
}

// CARREGAR LEADS
async function carregarLeads() {
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/leads`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(l => {
    lista.innerHTML += `
      <div class="lead">
        <b>${l.nome}</b><br>
        📞 ${l.telefone || "-"}<br>
        📧 ${l.email || "-"}
      </div>
    `;
  });
}

// SIMULAÇÕES
function conectarMeta() {
  alert("Integração Meta virá na próxima fase");
  document.getElementById("statusMeta").innerText = "Conectado (simulado)";
}

function criarPost() {
  const texto = document.getElementById("textoPost").value;
  if (!texto) return alert("Digite um texto");

  alert("Publicação criada (simulado)");
}

// AUTO LOGIN
const token = localStorage.getItem("token");
if (token) init();
</script>

</body>
</html>
