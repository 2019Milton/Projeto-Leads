name: Smoke novos nichos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar Faculdade/Universidade e Dentista
        run: node tests/smoke-novos-nichos.mjs
      - name: Validar retomada e descarte da criação de campanha
        run: node --test tests/criacao-campanha-em-andamento.test.cjs
      - name: Validar filtro de redes de origem da Central de Leads
        run: node --test tests/filtro-rede-origem.test.cjs
      - name: Verificar avisos de geração da IA
        run: node --test tests/aviso-criador-campanha.test.cjs
      - name: Validar desconexao isolada de Instagram
        run: node --test tests/smoke-desconectar-instagram.mjs
      - name: Validar conexao Instagram Login separada
        run: node --test tests/smoke-instagram-login-separado.mjs
      - name: Validar upload de video em novas plataformas
        run: node --test tests/rascunho-video-meta.test.cjs
