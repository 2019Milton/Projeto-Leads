<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🚀 Plataforma de Leads</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e2e8f0;
}

/* ===== FUNDO ESTRELADO ===== */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0.2;
  z-index: 0;
}

/* ===== LOGIN ===== */
.container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(15, 23, 42, 0.9);
  padding: 40px;
  border-radius: 15px;
  width: 350px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.05);
  text-align: center;
}

.login-box h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  background: #020617;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}

.btn {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
}

/* ===== DASHBOARD ===== */
#app {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* topo */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logout {
  background: #ef4444;
  padding: 10px 20px;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* cards */
.card {
  background: rgba(30, 41, 59, 0.8);
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* card full */
.full {
  margin-top: 20px;
}

/* textarea */
textarea {
  width: 100%;
  height: 100px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  padding: 10px;
  background: #020617;
  color: white;
}

/* leads */
.lead {
  background: #020617;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

/* status */
.status-ok {
  color: #22c55e;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <div class="login-box">
    <h2>🚀 Plataforma de Leads</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">

  <div class="topbar">
    <h2>🚀 Dashboard</h2>
    <button class="logout" onclick="logout()">Sair</button>
  </div>

  <div class="grid">

    <!-- META -->
    <div class="card">
      <h3>🔗 Conectar Meta</h3>
      <button class="btn" onclick="conectarMeta()">Conectar Facebook / Instagram</button>
      <p id="statusMeta">Não conectado</p>
    </div>

    <!-- PUBLICAÇÃO -->
    <div class="card">
      <h3>📢 Criar Publicação</h3>
      <input type="file">
      <textarea id="textoPost" placeholder="Texto do anúncio"></textarea>
      <button class="btn" onclick="criarPost()">Publicar</button>
    </div>

  </div>

  <!-- LEADS -->
  <div class="card full">
    <h3>📊 Leads</h3>
    <div id="lista"></div>
  </div>

</div>

<script>
const API = "https://function-bun-production-446a.up.railway.app";

// LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, senha })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    init();
  } else {
    alert("Login inválido");
  }
}

// INIT
function init() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  carregarLeads();
}

// LOGOUT
function logout() {
  localStorage.removeItem("token");
  location.reload();
}

// LEADS
async function carregarLeads() {
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/leads`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(l => {
    lista.innerHTML += `
      <div class="lead">
        <b>${l.nome}</b><br>
        📞 ${l.telefone || "-"}<br>
        📧 ${l.email || "-"}
      </div>
    `;
  });
}

// SIMULAÇÕES
function conectarMeta() {
  document.getElementById("statusMeta").innerHTML =
    "<span class='status-ok'>● Conectado</span>";
}

function criarPost() {
  alert("Publicação criada 🚀");
}

// AUTO LOGIN
const token = localStorage.getItem("token");
if (token) init();
</script>

</body>
</html>
